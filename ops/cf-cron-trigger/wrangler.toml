name = "dsa-cron-trigger"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 不需要对外提供 HTTP 服务，只保留 Cron。仍会分配一个 workers.dev 域名，
# 但 fetch 入口有 TRIGGER_KEY 校验，未配置该密钥时直接 403。
workers_dev = true

[triggers]
# 一律 UTC，且刻意不写星期：Cloudflare 的 dow 解析有一位偏移（配 1-5 实测匹配
# 周日至周四、周五不触发），工作日过滤改由 src/index.js 的 isUtcWeekday 处理。
#   43 8  * * *  -> 北京 16:43，工作日执行：A 股日报
#   30 21 * * *  -> 北京次日 05:30，UTC 工作日执行：美股复盘 + A 股推荐
#                   （UTC 周五 21:30 会触发，对应北京周六早上推美股周五收盘复盘）
crons = ["43 8 * * *", "30 21 * * *"]

[vars]
GH_REPO = "xxyou00/daily_stock_analysis"
GH_REF = "main"

# 以下为密钥，不写在此文件里，用 wrangler secret put 设置：
#   GH_TOKEN           必需，GitHub PAT，需要该仓库的 Actions 写权限
#   ALERT_WEBHOOK_URL  可选，触发失败时告警的飞书机器人 webhook
#   TRIGGER_KEY        可选，配置后才允许 HTTP 手动触发
