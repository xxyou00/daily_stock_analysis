name: LLM Probe

on:
  workflow_dispatch:
    inputs:
      model:
        description: '模型 ID（网关原始 ID）'
        required: false
        default: 'nvidia/nemotron-3.5-lightning-30b-a3b'
      timeout_s:
        description: '单次请求超时秒数'
        required: false
        default: '300'

concurrency:
  group: llm-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🔎 nemotron 可用性 + JSON 遵循度 + reasoning_budget 影响
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          MODEL: ${{ inputs.model }}
          TIMEOUT_S: ${{ inputs.timeout_s }}
        run: |
          set -uo pipefail
          BASE="${BASE_URL:-https://integrate.api.nvidia.com/v1}"; BASE="${BASE%/}"

          curl -sS -o /tmp/models.json --max-time 60 \
            -H "Authorization: Bearer $OPENAI_API_KEY" "$BASE/models" >/dev/null || true
          echo "== 清单中的 nvidia/nemotron 系列 =="
          jq -r '(.data // [])[].id | select(test("nemotron"; "i"))' /tmp/models.json 2>/dev/null || echo "(none)"
          echo "== 目标模型是否在清单 =="
          if jq -e --arg id "$MODEL" '(.data // []) | any(.id == $id)' /tmp/models.json >/dev/null 2>&1; then
            LISTED="✅"; else LISTED="❌"; fi
          echo "$MODEL listed=$LISTED"

          PROMPT='请分析中钨高新(000657)当前的技术面与基本面，并严格以 JSON 输出，不要任何额外文字或 markdown 代码块。字段：trend(string 趋势判断), score(number 0-100 评分), reason(string 不少于150字的理由), risks(array of string 至少3条风险)。'

          {
            echo "## nemotron 探活 — \`$MODEL\`（清单 $LISTED）"
            echo ""
            echo "| # | 配置 | max_tokens | HTTP | 耗时(s) | finish | reasoning长度 | content长度 | JSON | 字段 |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          run_case () {
            local idx="$1" label="$2" mt="$3" extra="$4"
            echo ""
            echo "########## case $idx: $label / max_tokens=$mt ##########"
            echo "extra_body=$extra"

            if [ "$extra" = "none" ]; then
              jq -n --arg model "$MODEL" --arg p "$PROMPT" --argjson mt "$mt" \
                '{model:$model, messages:[{role:"user",content:$p}],
                  temperature:1, top_p:0.95, max_tokens:$mt, stream:false}' > /tmp/req.json
            else
              jq -n --arg model "$MODEL" --arg p "$PROMPT" --argjson mt "$mt" --argjson extra "$extra" \
                '{model:$model, messages:[{role:"user",content:$p}],
                  temperature:1, top_p:0.95, max_tokens:$mt, stream:false} + $extra' > /tmp/req.json
            fi

            OUT=$(curl -sS -o /tmp/resp.json -w '%{http_code} %{time_total}' --max-time "$TIMEOUT_S" \
              -H "Authorization: Bearer $OPENAI_API_KEY" -H 'Content-Type: application/json' \
              -d @/tmp/req.json "$BASE/chat/completions" 2>/tmp/curl.err || echo "000 0")
            local CODE="${OUT%% *}" ELAPSED="${OUT##* }"
            local FINISH="-" CLEN="-" RLEN="-" PARSE="-" FIELDS="-"

            if [ "$CODE" = "200" ]; then
              FINISH=$(jq -r '.choices[0].finish_reason // "-"' /tmp/resp.json)
              CLEN=$(jq -r '(.choices[0].message.content // "")|tostring|length' /tmp/resp.json)
              RLEN=$(jq -r '(.choices[0].message.reasoning_content // .choices[0].message.reasoning // "")|tostring|length' /tmp/resp.json)
              jq -r '(.choices[0].message.content // "")' /tmp/resp.json > /tmp/content.txt
              sed -e 's/^[[:space:]]*```json[[:space:]]*//' -e 's/^[[:space:]]*```[[:space:]]*//' -e 's/```[[:space:]]*$//' /tmp/content.txt > /tmp/cc.txt
              if jq -e . /tmp/cc.txt >/dev/null 2>&1; then
                PARSE="✅"
                if jq -e 'has("trend") and has("score") and has("reason") and has("risks")' /tmp/cc.txt >/dev/null 2>&1; then
                  FIELDS="✅ 4/4"; else FIELDS="⚠️ $(jq -r '[keys[]]|join(",")' /tmp/cc.txt 2>/dev/null | head -c 50)"; fi
              else
                PARSE="❌ 不可解析"; FIELDS="-"
              fi
              echo "http=200 time=${ELAPSED}s finish=$FINISH reasoning_len=$RLEN content_len=$CLEN json=$PARSE"
              echo "usage: $(jq -c '.usage // {}' /tmp/resp.json)"
              echo "message keys: $(jq -c '.choices[0].message|keys' /tmp/resp.json 2>/dev/null)"
              echo "content 头 180: $(head -c 180 /tmp/content.txt | tr -d '\n|')"
              echo "content 尾 100: $(tail -c 100 /tmp/content.txt | tr -d '\n|')"
            else
              local ERRMSG
              ERRMSG=$(jq -r '(.error.message // .detail // .title // .message // empty)|tostring' /tmp/resp.json 2>/dev/null)
              [ -z "$ERRMSG" ] && ERRMSG=$(head -c 300 /tmp/resp.json | tr -d '\n|')
              PARSE="FAIL"; FIELDS="${ERRMSG:-no-body}"
              echo "http=$CODE time=${ELAPSED}s $ERRMSG"
            fi

            echo "| $idx | $label | $mt | \`$CODE\` | $ELAPSED | $FINISH | $RLEN | $CLEN | $PARSE | $FIELDS |" >> "$GITHUB_STEP_SUMMARY"
            sleep 10
          }

          # 1) 项目现状口径：不发 extra_body，项目的 max_tokens
          run_case 1 "不发 extra_body（现状口径）" 8192 none
          # 2) 用户示例原样：enable_thinking + reasoning_budget 16384，但用项目的 8192 输出上限（关键风险场景）
          run_case 2 "enable_thinking + reasoning_budget=16384" 8192 '{"chat_template_kwargs":{"enable_thinking":true},"reasoning_budget":16384}'
          # 3) 用户示例原样 + 示例的 16384 上限
          run_case 3 "enable_thinking + reasoning_budget=16384" 16384 '{"chat_template_kwargs":{"enable_thinking":true},"reasoning_budget":16384}'
          # 4) 思维链预算收敛到输出上限之内
          run_case 4 "enable_thinking + reasoning_budget=4096" 8192 '{"chat_template_kwargs":{"enable_thinking":true},"reasoning_budget":4096}'
          # 5) 显式关闭思维链
          run_case 5 "enable_thinking=false" 8192 '{"chat_template_kwargs":{"enable_thinking":false}}'

          echo ""
          echo "probe finished"
