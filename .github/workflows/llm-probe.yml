name: LLM Probe

on:
  workflow_dispatch:
    inputs:
      models:
        description: '模型 ID 列表'
        required: false
        default: 'meta/muse-glimmer-30b,nvidia/nemotron-3.5-lightning-30b-a3b'
      rounds:
        description: '每个模型跑几轮（JSON 稳定性）'
        required: false
        default: '3'

concurrency:
  group: llm-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 📦 install json-repair
        run: pip install -q json-repair

      - name: 🔎 用项目的 JSON 修复逻辑判定可用性
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          MODELS: ${{ inputs.models }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          set -uo pipefail
          BASE="${BASE_URL:-https://integrate.api.nvidia.com/v1}"; BASE="${BASE%/}"

          read -r -d '' PROMPT <<'EOP' || true
          请分析中钨高新(000657)，严格只输出一个 JSON 对象，不要 markdown 代码块、不要任何解释文字。必须包含以下全部字段，嵌套层级不得省略：
          {
            "stock_name": "字符串",
            "sentiment_score": 0-100 的数字,
            "trend_prediction": "字符串",
            "operation_advice": "字符串",
            "decision_type": "buy 或 hold 或 watch 或 sell",
            "analysis_summary": "不少于150字的中文分析",
            "stop_loss": "字符串价位或区间",
            "risk_alerts": ["至少3条风险"],
            "dashboard": {
              "core_conclusion": { "one_sentence": "一句话结论" },
              "intelligence": { "risk_alerts": ["至少2条情报风险"] },
              "battle_plan": { "sniper_points": { "entry": "入场点", "target": "目标位" } }
            }
          }
          EOP

          # 复刻 src/analyzer.py 的 _load_analysis_json_candidate + _fix_json_string 判定链
          cat > /tmp/judge.py <<'PYEOF'
          import json, re, sys
          from json_repair import repair_json

          def fix_json_string(s):
              s = re.sub(r'//.*?\n', '\n', s)
              s = re.sub(r'/\*.*?\*/', '', s, flags=re.DOTALL)
              s = re.sub(r',\s*}', '}', s)
              s = re.sub(r',\s*]', ']', s)
              s = s.replace('True', 'true').replace('False', 'false')
              return repair_json(s)

          def load_candidate(js):
              """返回 (data, 使用了修复吗)；抛异常表示项目也会判为 invalid_json"""
              try:
                  return json.loads(js), False
              except json.JSONDecodeError:
                  stripped = (js or '').strip()
                  try:
                      _obj, end = json.JSONDecoder().raw_decode(stripped)
                  except json.JSONDecodeError:
                      pass
                  else:
                      if stripped[end:].strip():
                          raise
                  if not (stripped.startswith('{') and stripped.endswith('}')):
                      raise ValueError('not_object_shaped')
                  return json.loads(fix_json_string(stripped)), True

          text = open(sys.argv[1], encoding='utf-8').read()
          stripped = text.strip()
          # _extract_analysis_json_object 的 fence 处理
          fences = list(re.finditer(r"```[ \t]*([A-Za-z0-9_-]*)[ \t]*\n?(.*?)```", text, re.DOTALL))
          if len(fences) > 1:
              print("VERDICT=INVALID reason=ambiguous_json"); raise SystemExit
          if len(fences) == 1:
              outside = (text[:fences[0].start()] + text[fences[0].end():]).strip()
              if outside:
                  print("VERDICT=INVALID reason=ambiguous_json"); raise SystemExit
              stripped = fences[0].group(2).strip()
          elif '```' in text:
              print("VERDICT=INVALID reason=ambiguous_json"); raise SystemExit

          try:
              data, repaired = load_candidate(stripped)
          except Exception as e:
              print(f"VERDICT=INVALID reason={type(e).__name__}:{e}")
              raise SystemExit

          top = ["stock_name","sentiment_score","operation_advice","analysis_summary",
                 "decision_type","stop_loss","risk_alerts"]
          miss = [k for k in top if k not in data]
          d = data.get("dashboard") or {}
          nest_ok = (
              isinstance((d.get("core_conclusion") or {}).get("one_sentence"), str)
              and isinstance((d.get("intelligence") or {}).get("risk_alerts"), list)
              and isinstance((d.get("battle_plan") or {}).get("sniper_points"), dict)
          )
          summary_len = len(str(data.get("analysis_summary") or ""))
          print(f"VERDICT=VALID repaired={repaired} top_missing={miss or 'none'} "
                f"nested_ok={nest_ok} summary_len={summary_len}")
          PYEOF

          {
            echo "## 用项目 JSON 修复链判定（含 json_repair）"
            echo ""
            echo "| 模型 | 轮 | HTTP | 耗时(s) | reasoning | content | 项目判定 | 需修复 | 顶层缺项 | 嵌套 | summary |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          IFS=',' read -ra ARR <<< "$MODELS"
          for raw in "${ARR[@]}"; do
            M="$(echo "$raw" | tr -d '[:space:]')"; [ -z "$M" ] && continue
            echo ""; echo "########## $M ##########"
            for r in $(seq 1 "$ROUNDS"); do
              jq -n --arg model "$M" --arg p "$PROMPT" \
                '{model:$model, messages:[{role:"user",content:$p}],
                  temperature:1, top_p:0.95, max_tokens:16384, stream:false}' > /tmp/req.json
              OUT=$(curl -sS -o /tmp/resp.json -w '%{http_code} %{time_total}' --max-time 400 \
                -H "Authorization: Bearer $OPENAI_API_KEY" -H 'Content-Type: application/json' \
                -d @/tmp/req.json "$BASE/chat/completions" || echo "000 0")
              CODE="${OUT%% *}"; ELAPSED="${OUT##* }"
              if [ "$CODE" != "200" ]; then
                echo "round=$r http=$CODE"
                echo "| \`$M\` | $r | \`$CODE\` | $ELAPSED | - | - | HTTP 失败 | - | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
                sleep 8; continue
              fi
              RLEN=$(jq -r '(.choices[0].message.reasoning_content // .choices[0].message.reasoning // "")|tostring|length' /tmp/resp.json)
              CLEN=$(jq -r '(.choices[0].message.content // "")|tostring|length' /tmp/resp.json)
              jq -r '(.choices[0].message.content // "")' /tmp/resp.json > "/tmp/out_${r}.txt"
              V=$(python /tmp/judge.py "/tmp/out_${r}.txt" 2>&1 | tail -1)
              echo "round=$r http=200 time=${ELAPSED}s reasoning=$RLEN content=$CLEN :: $V"
              echo "  头80: $(head -c 80 "/tmp/out_${r}.txt" | tr -d '\n|')"

              VERDICT=$(echo "$V" | grep -oE 'VERDICT=[A-Z]+' | cut -d= -f2)
              REP=$(echo "$V" | grep -oE 'repaired=[A-Za-z]+' | cut -d= -f2)
              MISS=$(echo "$V" | grep -oE 'top_missing=[^ ]+' | cut -d= -f2)
              NEST=$(echo "$V" | grep -oE 'nested_ok=[A-Za-z]+' | cut -d= -f2)
              SLEN=$(echo "$V" | grep -oE 'summary_len=[0-9]+' | cut -d= -f2)
              REASON=$(echo "$V" | grep -oE 'reason=.*' | head -c 60)
              echo "| \`$M\` | $r | \`200\` | $ELAPSED | $RLEN | $CLEN | ${VERDICT:-?} ${REASON} | ${REP:--} | ${MISS:--} | ${NEST:--} | ${SLEN:--} |" >> "$GITHUB_STEP_SUMMARY"
              sleep 8
            done
          done

          echo ""; echo "probe finished"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: raw-outputs-${{ github.run_number }}
          path: /tmp/out_*.txt
          if-no-files-found: ignore
